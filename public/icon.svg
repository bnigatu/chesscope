<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Chesscope mark: pawn rising out of a scope lens (halo knockout
       where they cross) + reticle stubs on the sides and bottom.
       Ink plate, ember mark - matches the site theme tokens. -->
  <rect width="32" height="32" rx="7" fill="#1f2024"/>
  <g transform="translate(4 4)">
    <mask id="halo">
      <rect x="-4" y="-4" width="32" height="32" fill="white"/>
      <g transform="translate(12 11.2) scale(0.86) translate(-12 -12.6)" fill="black" stroke="black" stroke-width="2.4">
        <circle cx="12" cy="7.6" r="3.1"/>
        <rect x="8.9" y="10.6" width="6.2" height="1.9" rx="0.95"/>
        <path d="M10.1 12.5 h3.8 c.15 2.1 .75 3.4 1.7 4.9 h-7.2 c.95-1.5 1.55-2.8 1.7-4.9 z"/>
        <rect x="7.6" y="17.6" width="8.8" height="2.5" rx="1.0"/>
      </g>
    </mask>
    <circle cx="12" cy="13.4" r="7.4" fill="none" stroke="#f0895a" stroke-width="2" mask="url(#halo)"/>
    <g stroke="#f0895a" stroke-width="1.7" stroke-linecap="round">
      <line x1="5.7" y1="13.4" x2="7.9" y2="13.4"/>
      <line x1="16.1" y1="13.4" x2="18.3" y2="13.4"/>
      <line x1="12" y1="17.8" x2="12" y2="19.6"/>
    </g>
    <g transform="translate(12 11.2) scale(0.72) translate(-12 -12.6)" fill="#f0895a">
      <circle cx="12" cy="7.6" r="3.1"/>
      <rect x="8.9" y="10.6" width="6.2" height="1.9" rx="0.95"/>
      <path d="M10.1 12.5 h3.8 c.15 2.1 .75 3.4 1.7 4.9 h-7.2 c.95-1.5 1.55-2.8 1.7-4.9 z"/>
      <rect x="7.6" y="17.6" width="8.8" height="2.5" rx="1.0"/>
    </g>
  </g>
</svg>
